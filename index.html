<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100b20">
<title>GTA VI Global Countdown</title>
<style>
:root{--pink:#ff65ad;--cyan:#76efff;--ink:#090817;--muted:#d2cde2}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{min-height:100vh;margin:0;padding:clamp(14px,3vw,38px);overflow-x:hidden;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter, sans-serif;background:#090817 url("https://www.rockstargames.com/VI/_next/static/media/Official_Cover_Art_landscape.12.uu2irr.2_a.jpg?akim=1&imdensity=1&imwidth=1600") center center/cover fixed no-repeat;position:relative}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(135deg,rgba(5,5,18,.58),rgba(14,7,28,.45) 45%,rgba(5,7,20,.72)),radial-gradient(ellipse at 20% 5%,rgba(255,101,173,.16),transparent 42%),radial-gradient(ellipse at 85% 80%,rgba(118,239,255,.12),transparent 40%)}
main{position:relative;z-index:1;width:min(100%,1240px);margin:0 auto;padding:clamp(18px,3vw,38px);border:1px solid rgba(255,255,255,.27);border-radius:clamp(22px,3vw,34px);background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.055) 42%,rgba(255,255,255,.09));box-shadow:0 30px 100px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.08);backdrop-filter:blur(28px) saturate(155%);-webkit-backdrop-filter:blur(28px) saturate(155%);overflow:visible}
header{text-align:center;padding:clamp(4px,1vw,12px) 0 0}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:13px;padding:8px 13px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.09);box-shadow:inset 0 1px rgba(255,255,255,.16);color:#f0eaf8;font-size:clamp(.62rem,.85vw,.76rem);font-weight:750;letter-spacing:.16em;text-transform:uppercase}
.eyebrow:before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--pink);box-shadow:0 0 13px var(--pink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,4.1rem);line-height:1.04;font-weight:900;letter-spacing:-.055em;text-transform:uppercase;text-wrap:balance;text-shadow:0 3px 25px rgba(0,0,0,.28)}
h1 span{color:var(--pink);letter-spacing:0;text-shadow:0 0 30px rgba(255,101,173,.3)}
.subtitle{margin:13px 0 0;color:rgba(248,244,255,.78);font-size:clamp(.8rem,1.4vw,1rem);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.5vw,18px);margin-top:clamp(22px,3vw,34px);align-items:stretch}
.city{position:relative;isolation:isolate;min-width:0;padding:clamp(13px,1.6vw,20px);border:1px solid rgba(255,255,255,.2);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.145),rgba(255,255,255,.055) 55%,rgba(255,255,255,.085));box-shadow:0 10px 28px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);transition:transform .2s ease,border-color .2s ease,background .2s ease}
.city:before{content:"";position:absolute;inset:1px 1px auto;height:42%;border-radius:19px 19px 55% 55%;background:linear-gradient(180deg,rgba(255,255,255,.09),transparent);pointer-events:none;z-index:-1}
.city.featured{border-color:rgba(255,101,173,.72);background:linear-gradient(145deg,rgba(255,101,173,.2),rgba(255,255,255,.075) 58%,rgba(118,239,255,.08));box-shadow:0 0 0 1px rgba(255,101,173,.08),0 14px 36px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.34)}
.city-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;min-width:0}
.flag{font-size:clamp(1.15rem,1.8vw,1.6rem);line-height:1;filter:drop-shadow(0 2px 4px #0002)}
.city-name{min-width:0;font-weight:780;font-size:clamp(.83rem,1.15vw,1.02rem);white-space:normal;overflow-wrap:anywhere;line-height:1.2}
.city-zone{margin-left:auto;color:rgba(245,240,255,.66);font-size:clamp(.6rem,.75vw,.7rem);text-align:right;line-height:1.25}
.time{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,.7vw,8px)}
.unit{min-width:0;text-align:center;padding:clamp(9px,1.1vw,13px) 2px 9px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(10,8,24,.24);box-shadow:inset 0 1px rgba(255,255,255,.09)}
.num{display:block;font-size:clamp(1.05rem,2vw,1.8rem);font-weight:850;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.055em}
.lab{display:block;margin-top:6px;color:rgba(240,235,250,.65);font-size:clamp(.49rem,.65vw,.62rem);font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.city.featured .num{color:#fff;text-shadow:0 0 18px rgba(255,101,173,.22)}
@media(hover:hover){.city:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.38)}}
@media(max-width:900px){body{background-attachment:scroll}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:clamp(16px,3vw,28px)}.city-zone{font-size:.65rem}}
@media(max-width:520px){body{padding:10px 9px 22px}main{padding:20px 12px;border-radius:24px}.eyebrow{font-size:.59rem;letter-spacing:.1em;padding:7px 10px}h1{font-size:clamp(1.7rem,8vw,2.45rem)}.subtitle{max-width:29ch;margin:11px auto 0}.grid{grid-template-columns:minmax(0,1fr);gap:10px;margin-top:22px}.city{padding:15px 14px;border-radius:17px}.city-head{margin-bottom:11px}.city-zone{display:block;font-size:.67rem}.num{font-size:clamp(1.4rem,7vw,1.8rem)}.unit{padding:10px 2px 9px}.lab{font-size:.56rem}}
@media(prefers-reduced-motion:no-preference){main{animation:arrive .55s ease-out both}@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){main,.city{background:rgba(14,10,31,.92)}}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">The countdown is on · worldwide</div>
<h1>Grand Theft Auto <span>VI</span></h1>
<p class="subtitle">One screen. Major time zones. The wait is almost over.</p>
</header>
<section class="grid" id="grid" aria-label="GTA VI countdowns by region"></section>

</main>
<script>
const regions=[
 {flag:"🇳🇿",name:"Auckland",zone:"Pacific/Auckland",label:"New Zealand",featured:true},
 {flag:"🇳🇿",name:"Chatham Islands",zone:"Pacific/Chatham",label:"New Zealand"},
 {flag:"🇦🇺",name:"Sydney",zone:"Australia/Sydney",label:"Australia"},
 {flag:"🇯🇵",name:"Tokyo",zone:"Asia/Tokyo",label:"Japan"},
 {flag:"🇸🇬",name:"Singapore",zone:"Asia/Singapore",label:"Singapore"},
 {flag:"🇦🇪",name:"Dubai",zone:"Asia/Dubai",label:"UAE"},
 {flag:"🇬🇧",name:"London",zone:"Europe/London",label:"United Kingdom"},
 {flag:"🇫🇷",name:"Paris",zone:"Europe/Paris",label:"France"},
 {flag:"🇿🇦",name:"Johannesburg",zone:"Africa/Johannesburg",label:"South Africa"},
 {flag:"🇺🇸",name:"New York",zone:"America/New_York",label:"USA · Eastern"},
 {flag:"🇺🇸",name:"Chicago",zone:"America/Chicago",label:"USA · Central"},
 {flag:"🇺🇸",name:"Los Angeles",zone:"America/Los_Angeles",label:"USA · Pacific"}
];
const pad=n=>String(n).padStart(2,"0");
function zonedParts(date,zone){
 const parts=new Intl.DateTimeFormat("en-GB",{timeZone:zone,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(date);
 return Object.fromEntries(parts.filter(p=>p.type!=="literal").map(p=>[p.type,Number(p.value)]));
}
function localMidnightAsUtc(zone){
 const wanted=Date.UTC(2026,10,19,0,0,0);
 let guess=wanted;
 for(let i=0;i<4;i++){
  const p=zonedParts(new Date(guess),zone);
  const shown=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
  const correction=wanted-shown;
  guess+=correction;
  if(correction===0)break;
 }
 return guess;
}
const grid=document.getElementById("grid");
const nodes=regions.map((r,i)=>{
 const card=document.createElement("article");
 card.className="city"+(r.featured?" featured":"");
 card.innerHTML='<div class="city-head"><span class="flag" aria-hidden="true">'+r.flag+'</span><span class="city-name">'+r.name+'</span><span class="city-zone">'+r.label+'</span></div><div class="time" aria-label="Time remaining"><div class="unit"><span class="num" data-unit="days">--</span><span class="lab">Days</span></div><div class="unit"><span class="num" data-unit="hours">--</span><span class="lab">Hours</span></div><div class="unit"><span class="num" data-unit="minutes">--</span><span class="lab">Mins</span></div><div class="unit"><span class="num" data-unit="seconds">--</span><span class="lab">Secs</span></div></div>';
 grid.appendChild(card);
 return {region:r,target:localMidnightAsUtc(r.zone),elements:Object.fromEntries([...card.querySelectorAll("[data-unit]")].map(el=>[el.dataset.unit,el]))};
});
function update(){
 const now=Date.now();
 for(const item of nodes){
  let ms=Math.max(0,item.target-now);
  const values={days:Math.floor(ms/86400000),hours:Math.floor(ms%86400000/3600000),minutes:Math.floor(ms%3600000/60000),seconds:Math.floor(ms%60000/1000)};
  for(const [unit,value] of Object.entries(values))item.elements[unit].textContent=unit==="days"?String(value):pad(value);
  if(ms===0)item.region.done=true;
 }
}
update();
setInterval(update,1000);
</script>
</body>
</html>

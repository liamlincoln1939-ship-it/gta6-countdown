<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b20">
  <title>Deadly Decisions — GTA VI Countdown</title>
  <style>
    :root {
      --pink: #ff4f9a;
      --cyan: #5cecff;
      --ink: #100b20;
      --muted: #c7c4d8;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #100b20;
      background-image:
        linear-gradient(180deg, rgba(7, 6, 18, .48) 0%, rgba(7, 6, 18, .70) 48%, rgba(7, 6, 18, .88) 100%),
        url("https://www.rockstargames.com/VI/_next/static/media/Official_Cover_Art_landscape.12.uu2irr.2_a.jpg?akim=1&imdensity=1&imwidth=1600");
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 15%, rgba(5, 4, 15, .42) 100%);
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(100%, 1040px);
      text-align: center;
      padding: clamp(26px, 5vw, 58px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(10,8,25,.76), rgba(10,8,25,.56));
      box-shadow: 0 30px 100px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(8px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
      color: #e5deef;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 13px var(--pink); }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5.7vw, 4.5rem);
      line-height: .98;
      font-weight: 950;
      letter-spacing: -.055em;
      text-transform: uppercase;
      text-shadow: 0 3px 0 rgba(0,0,0,.18);
    }
    h1 span {
      display: block;
      margin-top: 8px;
      color: var(--pink);
      letter-spacing: .015em;
      -webkit-text-stroke: .5px rgba(255,255,255,.18);
      text-shadow: 0 0 30px rgba(255,79,154,.2);
    }
    .subtitle { margin: 18px 0 0; color: var(--muted); font-size: clamp(.9rem, 1.8vw, 1.05rem); letter-spacing: .025em; }
    #timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(9px, 2vw, 18px);
      margin-top: clamp(30px, 5vw, 48px);
    }
    .time-box {
      min-width: 0;
      padding: clamp(16px, 3vw, 27px) 8px clamp(14px, 2.6vw, 23px);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 17px;
      background: rgba(8,10,27,.55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .time-box span {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2rem, 6.2vw, 4.6rem);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -.06em;
      color: #fff;
    }
    .time-box label {
      display: block;
      margin-top: 12px;
      color: #a8a4bf;
      font-size: clamp(.62rem, 1.5vw, .78rem);
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #a7a2bb;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .footer strong { color: #fff; font-weight: 800; }
    .footer .dash { width: 22px; height: 1px; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
    @media (max-width: 560px) {
      body { padding: 14px; overflow: auto; background-attachment: scroll; }
      main { padding: 28px 16px; border-radius: 20px; }
      .game-art-wrap { margin-top: 20px; border-radius: 13px; }
      #timer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .time-box { padding: 22px 8px 18px; }
      .footer { flex-wrap: wrap; font-size: .68rem; }
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive .7s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">The countdown is on</div>
    <h1>Grand Theft Auto <span>VI</span></h1>
    <p class="subtitle">Counting down to launch</p>
    <div id="timer" aria-label="Time until GTA VI release">
      <div class="time-box"><span id="days">00</span><label>Days</label></div>
      <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
      <div class="time-box"><span id="minutes">00</span><label>Minutes</label></div>
      <div class="time-box"><span id="seconds">00</span><label>Seconds</label></div>
    </div>
    <div class="footer"><span class="dash"></span><strong>Deadly Decisions</strong><span class="dash"></span></div>
  </main>
  <script>
    // Rockstar's currently announced date is November 19, 2026.
    // This countdown targets midnight UTC at the start of that date.
    const releaseDate = new Date('2026-11-19T00:00:00Z').getTime();
    const units = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    function updateCountdown() {
      const distance = releaseDate - Date.now();
      if (distance <= 0) {
        document.querySelector('h1').innerHTML = 'GTA VI <span>IS HERE</span>';
        document.querySelector('.subtitle').textContent = 'The wait is over.';
        Object.values(units).forEach(el => el.textContent = '00');
        clearInterval(countdownInterval);
        return;
      }
      units.days.textContent = String(Math.floor(distance / 86400000));
      units.hours.textContent = String(Math.floor((distance % 86400000) / 3600000)).padStart(2, '0');
      units.minutes.textContent = String(Math.floor((distance % 3600000) / 60000)).padStart(2, '0');
      units.seconds.textContent = String(Math.floor((distance % 60000) / 1000)).padStart(2, '0');
    }
    updateCountdown();
    const countdownInterval = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
